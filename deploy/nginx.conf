# Example Nginx server block for the landing page (adjust domain, paths and PHP-FPM socket).
server {
    listen 443 ssl http2;
    server_name example.ae www.example.ae;
    root /var/www/lp/public;
    index index.php;

    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 20m;          # dashboard image uploads (max 15 MB)

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build files and randomly named uploads never change: cache for a year.
    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /storage/uploads/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known) { deny all; }
}
