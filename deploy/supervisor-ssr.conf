; Keeps the Inertia SSR process (server-side rendering of the landing page) running.
; If it stops, the page still works — it just falls back to rendering in the browser.
[program:lp-ssr]
command=php /var/www/lp/artisan inertia:start-ssr
directory=/var/www/lp
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/lp/storage/logs/ssr.log
redirect_stderr=true
